// マイナスの差枚は数字を出さず「---」にする
const sdiffReal=n=>(n>0?"+":n<0?"−":"±")+fmt(Math.abs(n));
const sdiffPub=n=>Math.round(n)<0?"---":sdiffReal(n);   // 一般公開・投稿用
const sdiff=n=>canWrite?sdiffReal(n):sdiffPub(n);       // 管理者には本当の数字
const cls=n=>n>0?"plus":n<0?"minus":"muted";
const odds=(g,n)=>n?"1/"+Math.round(g/n):"-";
const rate=(out,diff)=>out?((out+diff)/out*100).toFixed(1)+"%":"-";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const live=days=>days.filter(d=>!d.none);
const sum=days=>live(days).reduce((a,d)=>({G:a.G+d.G,B:a.B+d.B,R:a.R+d.R,diff:a.diff+d.diff,out:a.out+d.out,n:a.n+1}),{G:0,B:0,R:0,diff:0,out:0,n:0});
const SER=i=>`var(--s${i%8+1})`;

/* ---------- 接続状態 ---------- */
let GH=null,canWrite=false,busy=false,loadErr="";
let DATA={v:1,names:[],days:{},posts:{}};
const setData=j=>{if(j&&j.days)DATA={v:1,names:j.names||[],days:j.days||{},posts:j.posts||{}}};
let RAW={},daysLoaded=false;
function decode(){RAW={};for(const[k,d]of Object.entries(DATA.days)){const rows=(d.rows||[]).map(r=>[r[0],DATA.names[r[1]]||"?",...r.slice(2)]);RAW[k]={...d,rows,n:rows.length,tot:rows.reduce((a,r)=>a+r[4],0)}}}

let prefs={period:"last",sort:"diff",desc:true,mperiod:"last",msort:"avg",t10:{k:"no",desc:false},tall:{k:"no",desc:false}};
try{const s=JSON.parse(localStorage.getItem("mitoAkatsukaPrefs")||"null");if(s)prefs={...prefs,...s}}catch(e){}
const savePrefs=()=>{try{localStorage.setItem("mitoAkatsukaPrefs",JSON.stringify(prefs))}catch(e){}};

/* ---------- 集計用の構造を作る ---------- */
let DATES=[],DAYS=[],NDAYS=0,UNITS=[],MODELS=[],byNo=new Map();
function build(){
  DATES=Object.keys(RAW).sort();DAYS=DATES.map(toDate);NDAYS=DATES.length;byNo=new Map();
  DATES.forEach((k,di)=>(RAW[k].rows||[]).forEach(r=>{
    const[no,name,G,out,diff,bb,rb,isl,rt]=r;let u=byNo.get(no);
    if(!u){u={no,days:Array(NDAYS).fill(null)};byNo.set(no,u)}
    u.name=name;if(isl)u.isl=isl;
    u.days[di]={date:DAYS[di],G:G||0,out:out||0,diff:diff||0,B:bb||0,R:rb||0,none:!G&&!out};
  }));
  UNITS=[...byNo.values()].sort((a,b)=>a.no-b.no);
  UNITS.forEach(u=>u.days=u.days.map((d,i)=>d||{date:DAYS[i],G:0,out:0,diff:0,B:0,R:0,none:true}));
  const mm=new Map();UNITS.forEach(u=>{if(!mm.has(u.name))mm.set(u.name,{name:u.name,units:[]});mm.get(u.name).units.push(u)});
  MODELS=[...mm.values()];
}
const latest=()=>NDAYS?`${md(DAYS[NDAYS-1])}(${WD[DAYS[NDAYS-1].getDay()]})`:"-";
function periods(){if(!NDAYS)return{};const L=NDAYS-1,p={last:{label:md(DAYS[L])+"("+WD[DAYS[L].getDay()]+")",from:L,to:L}};
  if(NDAYS>1)p.prev={label:md(DAYS[L-1])+"("+WD[DAYS[L-1].getDay()]+")",from:L-1,to:L-1};
  if(NDAYS>7)p.w7={label:"直近7日",from:L-6,to:L};
  if(NDAYS>2)p.all={label:"全期間（"+NDAYS+"日）",from:0,to:L};return p}
const P=k=>periods()[k]||periods().last;
const unitAgg=(u,p)=>({u,...sum(u.days.slice(p.from,p.to+1))});
const SORTS={diff:{label:"差枚",f:a=>a.diff},G:{label:"G数",f:a=>a.G},B:{label:"BB回数",f:a=>a.B},R:{label:"RB回数",f:a=>a.R},comb:{label:"合成確率",f:a=>(a.B+a.R)?(a.B+a.R)/a.G:-1}};
const islLabel=u=>u.isl?`<span class="isl-tag">島${u.isl}</span>`:"";

/* ---------- 画面遷移 ---------- */

let chartSel=null,hlUnit=null;

function go(view,params={}){if(view!=="admin")clearHash();hlUnit=null;hist.push({...state});state={view,params};render();window.scrollTo(0,0)}
function back(){state=hist.pop()||{view:"home",params:{}};render();window.scrollTo(0,0)}
const app=document.getElementById("app");
const TITLES={admin:"管理者ログイン",home:"マルハンメガシティ水戸赤塚",rank:"台別ランキング",mrank:"機種別ランキング",map:"島図",model:"機種別データ",unit:"台データ",trend:"曜日・日付の傾向",post:"結果まとめ",data:"データの追加・管理"};

function render(){
  document.getElementById("storeSub").textContent=TITLES[state.view]||"";
  document.getElementById("backbar").hidden=state.view==="home";
  const needsData=!["data","home","admin"].includes(state.view);
  app.innerHTML=banner()+(needsData&&!NDAYS?VIEWS.home():VIEWS[state.view]())+`<p class="foot">店舗公式のサイトではありません。数値はホールのデータを元にした集計です。${canWrite?`<br><button type="button" class="linkbtn" data-go="admin">管理者（ログイン中）</button>`:""}</p>`;chartSel=null;
  if(NDAYS&&(state.view==="unit"||state.view==="model"))bindChart();
}
function banner(){
  if(!canWrite)return "";
  return `<div class="banner"><b>管理者モード</b>　データの追加・削除と結果まとめの公開は、保存すると1〜2分で一般のページに反映されます。</div>`;
}
const dropZone=label=>canWrite?`<label class="drop dz-home" for="fileInHome"><b>${label}</b><span class="note">ページのどこにドロップしても読み込みます。複数日分まとめてOK</span></label><input type="file" id="fileInHome" accept=".xlsx,.xls,.csv" multiple hidden>`:"";
const postedDates=()=>Object.keys(DATA.posts).filter(k=>RAW[k]).sort();
const dlabel=k=>{const d=toDate(k);return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`};
function postMenu(){const ps=postedDates().reverse();
  if(canWrite)return `<nav class="card menu"><div class="label">結果まとめ（作成・公開）</div><button type="button" data-go="post">結果まとめを作る<span class="side">${latest()}</span></button>
    ${ps.slice(0,5).map(k=>`<button type="button" data-post="${k}">${dlabel(k)} ${esc(DATA.posts[k].ev||"")}<span class="side">公開中</span></button>`).join("")}</nav>`;
  if(!ps.length)return "";
  return `<nav class="card menu"><div class="label">結果まとめ</div>${ps.slice(0,10).map(k=>`<button type="button" data-post="${k}">${dlabel(k)} ${esc(DATA.posts[k].ev||"")}<span class="side"></span></button>`).join("")}</nav>`}
const infoCard=()=>`<div class="card info"><div class="sec-title">店舗情報</div><dl>
  <dt>住所</dt><dd>${STORE.addr}</dd><dt>営業時間</dt><dd>${STORE.hours}</dd><dt>設置台数</dt><dd>${STORE.units}</dd><dt>スロット</dt><dd>${STORE.slot}</dd></dl>
  <p class="note" style="margin:6px 0 0">台数・営業時間は公式サイトの掲載内容です。<a href="${STORE.url}" target="_blank" rel="noopener">公式の店舗ページ</a></p></div>`;

/* ---------- 各画面 ---------- */
const VIEWS={
home(){

  ${infoCard()}`},

    <div class="btns" style="margin-top:12px"><button type="button" class="order" id="ghLogout">ログアウト</button></div><p class="note">ログアウトすると、この端末に保存したトークンを消します。</p></div>`;

`},

rank(){const p=P(prefs.period);const f=SORTS[prefs.sort].f;
  const list=UNITS.map(u=>unitAgg(u,p)).filter(a=>a.n).sort((a,b)=>prefs.desc?f(b)-f(a):f(a)-f(b)).slice(0,30);
  return `<div><h1>${p.label}の${SORTS[prefs.sort].label} TOP30</h1><div class="meta">全 ${MODELS.length} 機種・${UNITS.length} 台（稼働のなかった台は除く）</div></div>
  <div class="card"><div class="controls">
    <label for="selPeriod">集計期間</label><select id="selPeriod" class="span2">${Object.entries(periods()).map(([k,v])=>`<option value="${k}"${k===prefs.period?" selected":""}>${v.label}</option>`).join("")}</select>
    <label for="selSort">並べ替え</label><select id="selSort">${Object.entries(SORTS).map(([k,v])=>`<option value="${k}"${k===prefs.sort?" selected":""}>${v.label}</option>`).join("")}</select>
    <button type="button" class="order" id="btnOrder">${prefs.desc?"▼ 大きい順":"▲ 小さい順"}</button></div>
  <div class="tbl-wrap"><table><thead><tr><th>順位</th><th class="l">機種・台</th><th>G数</th><th>大当り<span class="br">BB・RB</span></th><th>合成</th><th>差枚</th></tr></thead><tbody>
  ${list.map((a,i)=>`<tr class="go" data-unit="${a.u.no}"><td class="rank ${i<3?"r"+(i+1):""}">${i+1}</td><td class="l mname">${esc(a.u.name)}<br><span class="unit num">${a.u.no}番台</span>${islLabel(a.u)}</td><td class="num">${fmt(a.G)}</td><td class="num">${a.B+a.R}<span class="br">${a.B}・${a.R}</span></td><td class="num">${odds(a.G,a.B+a.R)}</td><td class="num diff ${cls(a.diff)}">${sdiff(a.diff)}</td></tr>`).join("")}
  </tbody></table></div></div>`},

mrank(){const p=P(prefs.mperiod);
  const rows=MODELS.map(m=>{const ag=m.units.map(u=>unitAgg(u,p)).filter(a=>a.n);const t=sum(m.units.flatMap(u=>u.days.slice(p.from,p.to+1)));const ud=t.n||1;
    return{m,...t,n:m.units.length,avg:Math.round(t.diff/ud),avgG:Math.round(t.G/ud),win:ag.filter(a=>a.diff>0).length,act:ag.length}}).filter(r=>r.act);
  const key=prefs.msort==="avg"?r=>r.avg:r=>r.diff;rows.sort((a,b)=>key(b)-key(a));

  <div class="tbl-wrap"><table><thead><tr><th>順位</th><th class="l">機種</th><th>台数</th><th>平均G</th><th>勝ち台</th><th>出玉率</th><th>平均差枚</th><th>合計差枚</th></tr></thead><tbody>

  </tbody></table></div></div>`},

  <div class="card map">${keys.map(k=>{const g=groups.get(k);const t=sum(g.map(u=>u.days[NDAYS-1]));return `<div class="island"><div class="island-name">${typeof k==="number"?`島${k}　`:""}${g[0].no}〜${g[g.length-1].no}番台（${g.length}台）　<span class="${cls(t.diff)} num">${t.n?sdiff(t.diff):"-"}</span></div><div class="island-row">

unit(){const u=byNo.get(state.params.no);if(!u)return VIEWS.home();const d=u.days[NDAYS-1];const tot=sum(u.days);const wins=u.days.filter(x=>!x.none&&x.diff>0).length;

  <div class="card"><div class="tbl-wrap"><table><thead><tr><th class="l">日付</th><th>BB</th><th>RB</th><th>合成</th><th>G数</th><th>出玉率</th><th>差枚</th></tr></thead><tbody>
  ${u.days.slice().reverse().map(x=>`<tr><td class="l num">${md(x.date)}<span class="muted">(${WD[x.date.getDay()]})</span></td><td class="num">${x.B}<span class="br">${odds(x.G,x.B)}</span></td><td class="num">${x.R}<span class="br">${odds(x.G,x.R)}</span></td><td class="num">${odds(x.G,x.B+x.R)}</td><td class="num">${x.none?"-":fmt(x.G)}</td><td class="num">${x.none?"-":rate(x.out,x.diff)}</td><td class="num diff ${cls(x.diff)}">${x.none?"-":sdiff(x.diff)}</td></tr>`).join("")}

function trendBlocks(groups){
  const wd=[...Array(7)].map(()=>({s:0,n:0,d:0,w:0})),tail=[...Array(10)].map(()=>({s:0,n:0,d:0,w:0}));
  groups.forEach(g=>{if(!g.length)return;const dt=g[0].date;const tot=g.reduce((a,x)=>a+x.diff,0);
    for(const o of [wd[dt.getDay()],tail[dt.getDate()%10]]){o.s+=tot;o.n+=g.length;o.d++;if(tot>0)o.w++}});
  const block=(title,arr,labels)=>{const vals=arr.map(o=>o.n?Math.round(o.s/o.n):0);const mx=Math.max(100,...vals.map(Math.abs));
    return `<div class="card"><div style="padding:14px 16px 0"><div class="sec-title">${title}</div><div class="note">1台平均差枚（お客様側プラスの日数/日数）</div></div><div class="bars">
    ${arr.map((o,i)=>{const v=vals[i],w=Math.abs(v)/mx*50;return `<div class="bar-row"><span>${labels[i]}</span><span class="bar-track">${o.d?`<span class="bar-fill" style="${v>=0?`left:50%;width:${w}%;background:var(--plus)`:`right:50%;width:${w}%;background:var(--minus)`}"></span>`:""}</span><span class="num ${cls(v)}">${o.d?sdiff(v):"-"} <span class="muted">${o.w}/${o.d}</span></span></div>`}).join("")}</div></div>`};
  const order=[1,2,3,4,5,6,0];
  return block("曜日別",order.map(i=>wd[i]),order.map(i=>WD[i]+"曜"))+block("日付末尾別",tail,[...Array(10)].map((_,i)=>i+"の日"));
}
function drawChart(series,from,to,hl){
  const el=document.getElementById("chart"),ro=document.getElementById("readout");if(!el)return;
  const n=to-from+1,dates=DAYS.slice(from,to+1);if(n<2)return;
  const W=700,H=300,L=62,R=14,T=14,B=34;
  const all=series.flatMap(s=>s.days.slice(from,to+1).map(d=>d.diff));
  const mx=Math.max(...all,1000),mn=Math.min(...all,-1000);
  const step=[1000,2000,2500,5000,10000,20000].find(s=>(mx-mn)/s<=6)||20000;
  const top=Math.ceil(mx/step)*step,bot=Math.floor(mn/step)*step;
  const x=i=>L+(W-L-R)*i/(n-1),y=v=>T+(H-T-B)*(top-v)/(top-bot);const mono='font-family="IBM Plex Mono,monospace"';
  let g="";for(let v=bot;v<=top;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:${v===0?"var(--muted)":"var(--line)"}" stroke-width="${v===0?2:1}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="13" fill="var(--muted)" ${mono}>${v<0&&!canWrite?"":fmt(v)}</text>`;
  const ticks=n>12?[0,Math.round((n-1)/3),Math.round((n-1)*2/3),n-1]:[...Array(n).keys()].filter(i=>i%3===0||i===n-1);
  const xl=[...new Set(ticks)].map(i=>`<text x="${x(i)}" y="${H-10}" text-anchor="${i===0?"start":i===n-1?"end":"middle"}" font-size="12" fill="var(--muted)" ${mono}>${md(dates[i])}</text>`).join("");
  const multi=series.length>1;
  const lines=series.map(s=>{const on=!hl||hl===s.no;const pts=s.days.slice(from,to+1).map((d,i)=>`${x(i).toFixed(1)},${y(d.diff).toFixed(1)}`);const w=multi?(hl===s.no?4:2):3;
    return `<g opacity="${on?1:.18}"><polyline points="${pts.join(" ")}" fill="none" stroke="${s.color}" stroke-width="${w}" stroke-linejoin="round"/>${multi?pts.map(p=>{const[a,b]=p.split(",");return `<circle cx="${a}" cy="${b}" r="3.5" fill="${s.color}" stroke="var(--surface)" stroke-width="1.5"/>`}).join(""):""}</g>`});
  const ord=series.map((s,k)=>k).sort((a,b)=>(series[a].no===hl)-(series[b].no===hl));const bw=(W-L-R)/(n-1);
  const hits=dates.map((_,i)=>`<rect x="${x(i)-bw/2}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent" data-i="${i}" style="cursor:pointer"/>`).join("");
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${n}日間の差枚推移">${g}${xl}${ord.map(k=>lines[k]).join("")}<line id="cur" x1="0" x2="0" y1="${T}" y2="${H-B}" style="stroke:var(--muted)" stroke-dasharray="3 4"/>${multi?"":`<circle id="dot" r="7" fill="var(--link)" stroke="var(--surface)" stroke-width="2"/>`}${hits}</svg>`;
  const sel=i=>{const c=el.querySelector("#cur");c.setAttribute("x1",x(i));c.setAttribute("x2",x(i));const dt=dates[i];const head=`<b class="num">${md(dt)}(${WD[dt.getDay()]})</b>`;
    if(!multi){const d=series[0].days[from+i];const dot=el.querySelector("#dot");dot.setAttribute("cx",x(i));dot.setAttribute("cy",y(d.diff));
      ro.innerHTML=`${head}<span>差枚 <b class="num ${cls(d.diff)}">${d.none?"-":sdiff(d.diff)}</b></span><span>G数 <span class="num">${fmt(d.G)}</span></span><span>BB/RB <span class="num">${d.B}/${d.R}</span></span><span>合成 <span class="num">${odds(d.G,d.B+d.R)}</span></span>`}
    else ro.innerHTML=head+series.map(s=>{const d=s.days[from+i];return `<span><i class="sw" style="background:${s.color}"></i><span class="num">${s.no}</span> <b class="num ${cls(d.diff)}">${d.none?"-":sdiff(d.diff)}</b></span>`}).join("")};
  el.querySelector("svg").addEventListener("click",e=>{const i=e.target.dataset&&e.target.dataset.i;if(i!==undefined){chartSel=+i;sel(+i)}});
  sel(chartSel==null||chartSel>=n?n-1:chartSel);
}

const shortName=n=>n.replace(/^(LB-|LB|L-|S-|L|S)\s?/,"").replace(/^-/,"");
function resultSummary(di){
  const us=UNITS.filter(u=>!u.days[di].none).map(u=>({no:u.no,isl:u.isl,name:shortName(u.name),model:u.name,d:u.days[di]}));
  const n=us.length,tot=us.reduce((a,u)=>a+u.d.diff,0);
  const byM=new Map();us.forEach(u=>{if(!byM.has(u.model))byM.set(u.model,[]);byM.get(u.model).push(u)});
  const ms=[...byM.values()].map(a=>({name:a[0].name,n:a.length,win:a.filter(u=>u.d.diff>0).length,avg:Math.round(a.reduce((s,u)=>s+u.d.diff,0)/a.length)}));
  const zen=ms.filter(m=>m.n>=3&&m.win/m.n>=2/3&&m.avg>=500).sort((a,b)=>b.avg-a.avg);
  const good=ms.filter(m=>m.n>=2&&m.avg>=500&&!zen.includes(m)).sort((a,b)=>b.avg-a.avg).slice(0,8);
  const tails=[...Array(10)].map(()=>({s:0,n:0,win:0}));us.forEach(u=>{const t=tails[u.no%10];t.s+=u.d.diff;t.n++;if(u.d.diff>0)t.win++});
  tails.forEach(t=>t.avg=t.n?Math.round(t.s/t.n):0);
  const bestTail=tails.map((t,i)=>[t.avg,i]).sort((a,b)=>b[0]-a[0]).slice(0,2).filter(x=>x[0]>0).map(x=>x[1]);
  const sorted=[...us].sort((a,b)=>a.no-b.no);const runs=[];let cur=[];let pairs=0;
  const flush=()=>{if(cur.length>=3)runs.push({from:cur[0].no,to:cur[cur.length-1].no,len:cur.length,avg:Math.round(cur.reduce((s,u)=>s+u.d.diff,0)/cur.length)});cur=[]};
  sorted.forEach((u,i)=>{const prev=sorted[i-1];const ok=u.d.diff>=1000;
    if(ok&&prev&&prev.no===u.no-1&&prev.isl===u.isl&&prev.d.diff>=1000){cur.push(u);if(cur.length===2)pairs++}else{flush();if(ok)cur=[u]}});flush();
  runs.sort((a,b)=>b.len-a.len||b.avg-a.avg);
  return{n,tot,avg:n?Math.round(tot/n):0,win:us.filter(u=>u.d.diff>0).length,c10k:us.filter(u=>u.d.diff>=10000).length,c5k:us.filter(u=>u.d.diff>=5000).length,c3k:us.filter(u=>u.d.diff>=3000).length,
    zen,good,tails,bestTail,runs:runs.slice(0,6),pairs,top:[...us].sort((a,b)=>b.d.diff-a.d.diff).slice(0,10)};
}

  if(R.good.length){L.push("＜優秀機種＞");R.good.slice(0,5).forEach(z=>L.push(`✅${z.name}(${z.win}/${z.n}台+)➡平均${sdiffPub(z.avg)}枚`))}
  if(R.bestTail.length){L.push("","🔢末尾考察🔢");R.bestTail.forEach(i=>{const t=R.tails[i];L.push(`📍末尾${i}➡平均${sdiffPub(t.avg)}枚(${t.win}/${t.n}台+)`)})}
  if(R.runs.length){L.push("","🔗並び🔗");R.runs.slice(0,3).forEach(r=>L.push(`📍${r.from}〜${r.to}番台の${r.len}台並び➡平均${sdiffPub(r.avg)}枚`))}
  return L.join("\n");
}

/* ---------- Excel 読み込み（列の自動判別） ---------- */
let PENDING=[],dataMsg="",delArm=null;
const FIELDS=[["no","台番",true],["name","機種名",true],["G","G数",false],["out","アウト",false],["diff","差枚/差玉",true],["bb","BB回数",false],["rb","RB回数",false],["bbp","BB確率(1/◯)",false],["rbp","RB確率(1/◯)",false],["isl","島番号",false]];
const DETECT={no:[/台番/],name:[/機種|名称/],G:[/G数|ゲーム数|総G|総スタート|累計スタート|回転数|総回転/],out:[/アウト|^OUT$/i],diff:[/差枚/,/差玉/],
  bb:[/^BB$|^BIG$|^BB回数|ビッグ回数/i],rb:[/^RB$|^REG$|^RB回数|レギュラー回数/i],bbp:[/BB確率|BIG確率/i],rbp:[/RB確率|REG確率/i],isl:[/島/]};
const colLetter=i=>{let s="";i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
const guessYear=m=>{const now=new Date();return m>now.getMonth()+2?now.getFullYear()-1:now.getFullYear()};
// ファイル名から日付（「11.20」「1120」「11月20日」「20261120」「2026-11-20」「1120修正」など）
function dateFromName(name){
  const base=nk(name).replace(/\.[^.]+$/,"");const ok=(m,d)=>m>=1&&m<=12&&d>=1&&d<=31;const p2=v=>String(v).padStart(2,"0");
  const m8=base.match(/(20\d{2})[-_.\/年]?(\d{1,2})[-_.\/月]?(\d{1,2})/);
  if(m8&&ok(+m8[2],+m8[3])&&(m8[2].length===2||/[-_.\/年]/.test(base)))return `${m8[1]}-${p2(m8[2])}-${p2(m8[3])}`;
  const sep=base.match(/(?:^|\D)(\d{1,2})[.\-_\/月](\d{1,2})(?:日|\D|$)/);
  if(sep&&ok(+sep[1],+sep[2]))return `${guessYear(+sep[1])}-${p2(sep[1])}-${p2(sep[2])}`;
  for(const r of base.match(/\d+/g)||[]){if(r.length===4&&ok(+r.slice(0,2),+r.slice(2))){const m=+r.slice(0,2);return `${guessYear(m)}-${r.slice(0,2)}-${r.slice(2)}`}}
  return "";
}
function analyze(file,aoa){
  let h=aoa.findIndex(r=>(r||[]).some(c=>/台番/.test(nk(c))));if(h<0)h=0;
  const head=(aoa[h]||[]).map(nk);let start=h+1;
  const noIdx=head.findIndex(x=>/台番/.test(x));
  const next=aoa[h+1]||[];const isData=r=>{const v=String(r?.[noIdx]??"").replace(/,/g,"").trim();return v!==""&&Number.isFinite(+v)};
  if(!isData(next)){next.forEach((c,i)=>{const v=nk(c);if(v)head[i]=head[i]?head[i]+" "+v:v});start=h+2}
  const width=Math.max(head.length,...aoa.slice(start,start+20).map(r=>(r||[]).length));
  const headers=[...Array(width)].map((_,i)=>head[i]||"");
  const map={};for(const[f]of FIELDS){const pats=DETECT[f];let idx=-1;for(const p of pats){idx=headers.findIndex((x,i)=>p.test(x)&&!Object.values(map).includes(i));if(idx>=0)break}map[f]=idx}
  const sign=map.diff>=0&&/差玉/.test(headers[map.diff])?"hall":"player";
  let date=dateFromName(file.name);
  if(!date){const txt=aoa.slice(0,Math.max(h,0)+3).flat().map(nk).join(" ");const m=txt.match(/(20\d{2})[\/年.\-](\d{1,2})[\/月.\-](\d{1,2})/);if(m)date=`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`}
  return{file:file.name,aoa,start,headers,map,sign,date,err:""};
}
function convert(p){
  const{map}=p;const num=v=>{const n=+String(v??"").replace(/[,，\s]/g,"").replace("−","-");return Number.isFinite(n)?n:0};
  if(map.no<0||map.name<0||map.diff<0)return{err:"台番・機種名・差枚（差玉）の列を選んでください"};
  if(map.G<0&&map.out<0)return{err:"G数かアウトのどちらかの列を選んでください"};
  const rows=[];for(const r of p.aoa.slice(p.start)){if(!r)continue;const no=num(r[map.no]);const nm=nk(r[map.name]);if(!Number.isInteger(no)||no<=0||!nm)continue;
    const out=map.out>=0?num(r[map.out]):0;const G=Math.round(map.G>=0?num(r[map.G]):out/3);let diff=num(r[map.diff]);if(p.sign==="hall")diff=-diff;
    const fromP=k=>{const den=map[k]>=0?num(r[map[k]]):0;return den>0&&G>0?Math.round(G/den):0};
    const bb=map.bb>=0?num(r[map.bb]):fromP("bbp"),rb=map.rb>=0?num(r[map.rb]):fromP("rbp");
    const isl=map.isl>=0?num(r[map.isl])||0:0;
    rows.push([no,nm,G,Math.round(out||G*3),Math.round(diff),bb,rb,isl])}
  if(!rows.length)return{err:"台番の行が見つかりません"};
  if(!/^\d{4}-\d{2}-\d{2}$/.test(p.date))return{err:"日付を入れてください",rows};
  return{rows};
}
function pendingCard(p,i){
  const c=convert(p);p.err=c.err||"";const rows=c.rows||[];const tot=rows.reduce((a,r)=>a+r[4],0);const act=rows.filter(r=>r[2]||r[3]);
  const opt=f=>`<option value="-1">なし</option>`+p.headers.map((h,k)=>`<option value="${k}"${p.map[f]===k?" selected":""}>${colLetter(k)}列${h?"："+esc(h):""}</option>`).join("");
  return `<div class="pend"><div class="pend-h"><b>${esc(p.file)}</b>${RAW[p.date]?`<span class="warn">保存すると、この日付の古いデータと差し替えます</span>`:""}</div>
   <div class="maprow"><label class="fl" for="pd${i}">日付<input type="date" id="pd${i}" data-p="${i}" data-pf="date" value="${esc(p.date)}"></label>
   ${FIELDS.map(([f,lab,req])=>`<label class="fl" for="pm${i}${f}">${lab}${req?"*":""}<select id="pm${i}${f}" data-p="${i}" data-pm="${f}">${opt(f)}</select></label>`).join("")}
   <label class="fl" for="ps${i}">差枚の向き<select id="ps${i}" data-p="${i}" data-pf="sign"><option value="player"${p.sign==="player"?" selected":""}>お客様側（そのまま）</option><option value="hall"${p.sign==="hall"?" selected":""}>ホール側の差玉（反転する）</option></select></label></div>
   ${p.err?`<p class="err">${esc(p.err)}</p>`:`<p class="note">${rows.length}台（稼働${act.length}台）　総差枚 <b class="${cls(tot)}">${sdiff(tot)}</b>　1台平均 ${sdiff(tot/(act.length||1))}　平均G ${fmt(act.reduce((a,r)=>a+r[2],0)/(act.length||1))}</p>
   <div class="tbl-wrap"><table class="mini"><thead><tr><th>台番</th><th class="l">機種名</th><th>G数</th><th>差枚</th><th>BB</th><th>RB</th></tr></thead><tbody>${rows.slice(0,3).map(r=>`<tr><td class="num">${r[0]}</td><td class="l">${esc(r[1])}</td><td class="num">${fmt(r[2])}</td><td class="num ${cls(r[4])}">${sdiff(r[4])}</td><td class="num">${r[5]}</td><td class="num">${r[6]}</td></tr>`).join("")}</tbody></table></div>`}</div>`;
}
async function readFiles(files,auto){
  const before=PENDING.length;
  for(const f of files){try{const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,blankrows:false,defval:""});PENDING.push(analyze(f,aoa))}
    catch(e){PENDING.push({file:f.name,aoa:[],start:0,headers:[],map:{},sign:"player",date:"",err:"このファイルは読み込めませんでした"})}}
  dataMsg="";
  if(auto){const added=PENDING.slice(before);const ok=added.filter(p=>!convert(p).err);
    if(ok.length){await savePending(ok,true)}
    const left=PENDING.length;if(left&&state.view!=="data"){go("data")}else render();return}
  render();
}
async function savePending(only){
  const ok=(only||PENDING).filter(p=>!convert(p).err);if(!ok.length)return;
  const last=new Map();ok.forEach(p=>last.set(p.date,p));const use=[...last.values()];
  const replaced=use.filter(p=>DATA.days[p.date]),added=use.filter(p=>!DATA.days[p.date]);
  const snap=JSON.stringify(DATA);const at=new Date().toISOString();
  for(const p of use){const prev=DATA.days[p.date];
    const rows=convert(p).rows.map(r=>{let i=DATA.names.indexOf(r[1]);if(i<0){DATA.names.push(r[1]);i=DATA.names.length-1}return [r[0],i,...r.slice(2)]});
    DATA.days[p.date]={rows,src:p.file.slice(0,120),at,rev:prev?(prev.rev||1)+1:1}}
  PENDING=PENDING.filter(p=>!ok.includes(p));
  const msg=(added.length?`追加して公開しました：${added.map(p=>md(toDate(p.date))).join("、")}`:"")
    +(replaced.length?`${added.length?"　":""}新しいデータに差し替えて公開しました：${replaced.map(p=>md(toDate(p.date))).join("、")}`:"")
    +(PENDING.length?`　確認が必要なファイルが${PENDING.length}件あります（もう一度読み込んでください）`:"");
  await publishState(msg,snap);
}
const fmtTime=iso=>{const d=new Date(iso);return isNaN(d)?"":`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};

/* ---------- GitHub への保存 ---------- */
const DATA_PATH="data.json";
const guessRepo=()=>{const h=location.hostname;if(!/\.github\.io$/i.test(h))return "";const o=h.split(".")[0];const r=location.pathname.split("/").filter(Boolean)[0];return `${o}/${r&&!/\.html?$/.test(r)?r:o+".github.io"}`};
const ghHead=(tok,acc)=>({Authorization:"Bearer "+tok,Accept:acc||"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});
const b64=str=>{const b=new TextEncoder().encode(str);let o="";for(let i=0;i<b.length;i+=0x8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(o)};
async function ghLogin(cfg,quiet){
  const base=`https://api.github.com/repos/${cfg.owner}/${cfg.repo}`;
  const r=await fetch(base,{headers:ghHead(cfg.token)});
  if(r.status===401)throw new Error("トークンが正しくないか、期限が切れています");
  if(r.status===404)throw new Error("リポジトリが見つからないか、このトークンで開けません");
  if(!r.ok)throw new Error("GitHubにつながりませんでした（"+r.status+"）");
  const info=await r.json();if(!info.permissions||!info.permissions.push)throw new Error("このトークンには書き込み権限がありません（Contents を Read and write にしてください）");
  const branch=info.default_branch||"main";
  const f=await fetch(`${base}/contents/${DATA_PATH}?ref=${encodeURIComponent(branch)}`,{headers:ghHead(cfg.token,"application/vnd.github.object"),cache:"no-store"});
  let sha=null;if(f.ok){sha=(await f.json()).sha;
    const raw=await fetch(`${base}/contents/${DATA_PATH}?ref=${encodeURIComponent(branch)}`,{headers:ghHead(cfg.token,"application/vnd.github.raw+json"),cache:"no-store"});
    if(raw.ok){try{setData(await raw.json())}catch(e){}}}
  else if(f.status!==404)throw new Error("data.json を読めませんでした（"+f.status+"）");
  GH={...cfg,branch,sha};canWrite=true;daysLoaded=true;decode();build();
}
async function publishState(msg,snap){
  if(!GH||!canWrite){flash("管理者としてログインしてください");return}
  busy=true;render();flash("保存しています…");
  try{
    const body={message:("水戸赤塚: "+msg).slice(0,120),content:b64(JSON.stringify(DATA)),branch:GH.branch};if(GH.sha)body.sha=GH.sha;
    const r=await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${DATA_PATH}`,{method:"PUT",headers:{...ghHead(GH.token),"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(r.status===409||r.status===422)throw{code:"conflict"};
    if(r.status===401||r.status===403)throw{code:"auth"};
    if(!r.ok)throw{code:"http"};
    const j=await r.json();GH.sha=j.content&&j.content.sha||null;
    busy=false;decode();build();render();flash(msg+"。一般のページには1〜2分で反映されます");
  }catch(e){
    if(snap)setData(JSON.parse(snap));decode();build();busy=false;render();
    const c=e&&e.code;
    flash(c==="conflict"?"ほかの管理者が先に更新していたため、保存されませんでした。ページを読み込み直してから、もう一度お試しください"
      :c==="auth"?"保存する権限がありません。トークンの期限や権限を確認して、ログインし直してください"
      :"保存できませんでした。通信状態を確認して、もう一度お試しください");
  }
}

  if(t.id==="brand"){clearHash();hist.length=0;state={view:"home",params:{}};render();window.scrollTo(0,0);return}
  if(t.id==="backBtn"){back();return}
  if(t.id==="btnOrder"){prefs.desc=!prefs.desc;savePrefs();render();return}
  if(t.dataset.post){go("post",{date:t.dataset.post});return}
  if(t.dataset.go)go(t.dataset.go);else if(t.dataset.model)go("model",{name:t.dataset.model});else if(t.dataset.unit)go("unit",{no:+t.dataset.unit});
});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="ghForm")return;e.preventDefault();
  const rp=document.getElementById("ghRepo").value.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\/+$/,"");const rawTok=document.getElementById("ghToken").value.normalize("NFKC");const tm=rawTok.match(/(github_pat_|ghp_)[A-Za-z0-9_]+/);const token=tm?tm[0]:rawTok.replace(/[^\x21-\x7e]/g,"");
  const m=rp.match(/^([\w.-]+)\/([\w.-]+)$/);if(!m||!token){dataMsg="リポジトリとトークンを入れてください";render();return}
